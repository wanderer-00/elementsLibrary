<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Count</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <p>Сменить alert неактивностью кнопок</p>

    <button class="count" onclick="minus()">-</button>
    <input class="count" id="count" type="number" placeholder="кол-во" min="1" value="1">
    <button class="count" onclick="plus()">+</button>
</body>
<script src="script.js"></script></html>
